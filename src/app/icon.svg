<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
  <!-- The Candid mark (src/components/app/app-shell.tsx), thickened for 16px. Ink on light in a
       light tab bar; inverted, with a hairline rim, in a dark one so it never becomes a black square. -->
  <style>
    .s { fill: #141414; stroke: #141414; }
    .l { stroke: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .s { fill: #f2f2f2; stroke: #3a3a3a; }
      .l { stroke: #141414; }
    }
  </style>
  <rect class="s" x="1" y="1" width="18" height="18" rx="5" stroke-width="0.75" />
  <path class="l" d="M4.8 7.3l1.9 1.9 3.3-3.3" fill="none" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" />
  <path class="l" d="M11.5 7.5H15.2M4.8 13.3h10.4" fill="none" stroke-width="2.1" stroke-linecap="round" />
</svg>
